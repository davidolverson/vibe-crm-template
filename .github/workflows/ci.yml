name: CI

# Runs lint, typecheck, and the full test suite (unit + integration) on every
# push to master and every PR. Deployment is handled separately by Coolify's
# push webhook — this workflow is the quality gate, not a deploy step.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Points prisma generate / migrate diff and the integration suite at the
      # postgres service below. prisma.ts auto-uses the pg adapter for localhost.
      DATABASE_URL: postgresql://postgres:testpw@localhost:55432/vibetest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: vibetest
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Apply schema to test database
        run: |
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script -o schema.sql
          PGPASSWORD=testpw psql -h localhost -p 55432 -U postgres -d vibetest -f schema.sql

      - name: Integration tests
        run: npm run test:integration
